<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Appointment Modal — Glass</title>
  <!-- Inter font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <!-- Remix Icon (icon font) -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    :root{ --ink:#0b1220; --muted:#6b7280; --line:rgba(0,0,0,.08); --dk:#111827;
           --glass:rgba(255,255,255,.34); }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#fff;color:var(--ink);overflow:hidden}

    /* Background blobs */
    .blob{position:fixed;z-index:0;filter:blur(180px);opacity:.95;pointer-events:none}
    .b1{width:820px;height:820px;left:-220px;top:-180px;background:radial-gradient(circle at 40% 40%,#6c96ff 0%,#bcd0ff 45%,transparent 72%);animation:float1 26s ease-in-out infinite}
    .b2{width:900px;height:900px;right:-260px;bottom:-180px;background:radial-gradient(circle at 60% 60%,#7ef0c9 0%,#c9f7ea 45%,transparent 72%);animation:float2 30s ease-in-out infinite}
    .b3{width:640px;height:640px;right:12%;top:6%;background:radial-gradient(circle at 50% 50%,#cfb9ff 0%,#efe9ff 45%,transparent 72%);animation:float3 28s ease-in-out infinite}
    @keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,22px)}}
    @keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,-26px)}}
    @keyframes float3{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,-22px)}}

    /* Dev open button */
    .open{position:fixed;left:12px;bottom:12px;z-index:2;appearance:none;border:1px solid var(--line);background:#111827;color:#fff;border-radius:12px;padding:10px 12px;font-weight:900;cursor:pointer}
  </style>
</head>
<body>
  <!-- Test background -->
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <button class="open" onclick="apxOpen()">Open</button>

  <!-- App script -->
  <script src="appointment-modal.js"></script>
</body>
</html>
